<div id="panel">
  @for (repository of repositories; track repository.name) {
    @defer(on viewport) {
        <div class="repository" (click)="openRepository(repository)">
            <img [ngSrc]="repository.icon"
                 [alt]="repository.name + ' icon'"
                 class="repository-icon"
                 width="200"
                 height="200"
                 loading="lazy" />

            <div class="repository-info">
                <div class="repository-header">
                    <h1>{{ repository.name }}</h1>
                    @if (repository.url) {
                        <a href="{{ repository.url }}" target="_blank" rel="GitHub Link">
                            <img ngSrc="assets/icons/github-mark.png" alt="GitHub Logo" width="240" height="240" loading="lazy"/>
                        </a>
                    }
                </div>
                <div class="repository-tags">
                    @for (tag of repository.tags; track tag) {
                        <span class="tag"> {{ tag }} </span>
                    }
                </div>
                <p>{{ repository.description }}</p>
            </div>
        </div>
    } @placeholder () {
        <h1>Loading...</h1>
    }
  }
</div>
